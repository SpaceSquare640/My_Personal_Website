<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — SpaceSquare Community</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .sub-hero { padding: 5rem 2rem 3rem; max-width: 1080px; margin: 0 auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 0.82rem; text-decoration: none;
      margin-bottom: 1.5rem; transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .posts-body { max-width: 1080px; margin: 0 auto; padding: 0 2rem 5rem; }
    .post-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .post-item {
      background: var(--bg2); padding: 1.5rem 2rem;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      text-decoration: none; color: inherit; transition: background 0.2s;
    }
    .post-item:hover { background: var(--bg3); }
    .post-tag {
      display: inline-block; font-size: 0.68rem; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 8px; border-radius: 99px;
      background: rgba(79,209,197,0.1); color: var(--accent2);
      border: 1px solid rgba(79,209,197,0.2); margin-bottom: 0.4rem;
    }
    .post-tag.game {
      background: rgba(124,110,255,0.12); color: var(--accent);
      border-color: rgba(124,110,255,0.2);
    }
    .post-title { font-family: var(--font-h); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.005em; line-height: 1.1; }
    .post-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; margin-top: 2px; }
    .empty-state {
      background: var(--surface); border: 1px dashed var(--border2);
      border-radius: var(--radius-lg); padding: 3rem 2rem;
      text-align: center; color: var(--muted); font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <nav class="nav" id="main-nav"></nav>

  <div class="page">
    <div class="sub-hero">
      <a class="back-link" href="community.html">← Community</a>
      <p class="section-label">Community · Blog</p>
      <h1 class="section-title" id="title">Blog</h1>
      <p class="section-desc" id="desc">Announcements, updates, and personal posts.</p>
    </div>

    <div class="posts-body">
      <div class="post-list">
        <a class="post-item" href="post-new-youtube-banner-icon.html">
          <div>
            <div class="post-tag" id="tag-p3">Channel Update</div>
            <div class="post-title" id="title-p3">New YouTube Channel Branding — Banner &amp; Icon</div>
          </div>
          <div class="post-date" id="date-p3">2026-05-27</div>
        </a>
        <a class="post-item" href="post-pikmin-bloom.html">
          <div>
            <div class="post-tag game" id="tag-p2">Game · Pikmin Bloom</div>
            <div class="post-title" id="title-p2">Let's Play Pikmin Bloom!</div>
          </div>
          <div class="post-date" id="date-p2">2026-05-25</div>
        </a>
        <a class="post-item" href="post-city-contrast.html">
          <div>
            <div class="post-tag" id="tag-p1">Photography</div>
            <div class="post-title" id="title-p1">城市縫隙 · City in Contrast</div>
          </div>
          <div class="post-date" id="date-p1">2025-11-08</div>
        </a>
      </div>
    </div>
  </div>

  <footer id="main-footer"></footer>

  <script src="../js/i18n.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const PAGE_TEXT = {
      en:        { title: 'Blog',   desc: 'Announcements, gaming, photography, and personal posts.', tagP1: 'Photography', titleP1: '城市縫隙 · City in Contrast', dateP1: '2025-11-08', tagP2: 'Game · Pikmin Bloom', titleP2: "Let's Play Pikmin Bloom!",       dateP2: '2026-05-25', tagP3: 'Channel Update', titleP3: 'New YouTube Channel Branding — Banner & Icon', dateP3: '2026-05-27' },
      'zh-hant': { title: '部落格', desc: '公告、遊戲、攝影及個人文章。',                              tagP1: '攝影',        titleP1: '城市縫隙 · City in Contrast', dateP1: '2025-11-08', tagP2: '遊戲 · Pikmin Bloom', titleP2: '一起來玩 Pikmin Bloom！',         dateP2: '2026年5月25日', tagP3: '頻道更新', titleP3: '全新 YouTube 頻道形象 — 橫額與頭像', dateP3: '2026年5月27日' },
      'zh-hans': { title: '博客',   desc: '公告、游戏、摄影及个人文章。',                              tagP1: '摄影',        titleP1: '城市缝隙 · City in Contrast', dateP1: '2025-11-08', tagP2: '游戏 · Pikmin Bloom', titleP2: '一起来玩 Pikmin Bloom！',         dateP2: '2026年5月25日', tagP3: '频道更新', titleP3: '全新 YouTube 频道形象 — 横幅与头像', dateP3: '2026年5月27日' },
    };
    function applyPageText() {
      const p = PAGE_TEXT[getLang()] || PAGE_TEXT.en;
      document.getElementById('title').textContent    = p.title;
      document.getElementById('desc').textContent     = p.desc;
      document.getElementById('tag-p1').textContent   = p.tagP1;
      document.getElementById('title-p1').textContent = p.titleP1;
      document.getElementById('date-p1').textContent  = p.dateP1;
      document.getElementById('tag-p2').textContent   = p.tagP2;
      document.getElementById('title-p2').textContent = p.titleP2;
      document.getElementById('date-p2').textContent  = p.dateP2;
      document.getElementById('tag-p3').textContent   = p.tagP3;
      document.getElementById('title-p3').textContent = p.titleP3;
      document.getElementById('date-p3').textContent  = p.dateP3;
    }
    initPage('community');
    applyPageText();
    document.addEventListener('langchange', applyPageText);
  </script>
</body>
</html>
