<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game — SpaceSquare Community</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .sub-hero { padding: 5rem 2rem 3rem; max-width: 1080px; margin: 0 auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 0.82rem; text-decoration: none;
      margin-bottom: 1.5rem; transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .posts-body { max-width: 1080px; margin: 0 auto; padding: 0 2rem 5rem; }
    .post-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .post-item {
      background: var(--bg2); padding: 1.5rem 2rem;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      text-decoration: none; color: inherit; transition: background 0.2s;
    }
    .post-item:hover { background: var(--bg3); }
    .post-tag {
      display: inline-block; font-size: 0.68rem; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 8px; border-radius: 99px;
      background: rgba(124,110,255,0.12); color: var(--accent);
      border: 1px solid rgba(124,110,255,0.2); margin-bottom: 0.4rem;
    }
    .post-title { font-family: var(--font-h); font-weight: 700; font-size: 0.95rem; }
    .post-date { color: var(--muted); font-size: 0.78rem; white-space: nowrap; margin-top: 2px; }
    .empty-state {
      background: var(--surface); border: 1px dashed var(--border2);
      border-radius: var(--radius-lg); padding: 3rem 2rem;
      text-align: center; color: var(--muted); font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <nav class="nav" id="main-nav"></nav>

  <div class="page">
    <div class="sub-hero">
      <a class="back-link" href="community.html">← Community</a>
      <p class="section-label">Community · Game</p>
      <h1 class="section-title" id="title">Game</h1>
      <p class="section-desc" id="desc">Gaming content, session highlights, and recommendations.</p>
    </div>

    <div class="posts-body">
      <div class="post-list">
        <a class="post-item" href="post-pikmin-bloom.html">
          <div>
            <div class="post-tag" id="tag-pikmin">Pikmin Bloom</div>
            <div class="post-title" id="title-pikmin">Let's Play Pikmin Bloom!</div>
          </div>
          <div class="post-date" id="date-pikmin">2026-05-25</div>
        </a>
      </div>
      <!--
        HOW TO ADD A POST:
        <a class="post-item" href="post-SLUG.html">
          <div>
            <div class="post-tag">Tag</div>
            <div class="post-title" id="title-SLUG">Post title here</div>
          </div>
          <div class="post-date" id="date-SLUG">2026-01-01</div>
        </a>
      -->
    </div>
  </div>

  <footer id="main-footer"></footer>

  <script src="../js/i18n.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const PAGE_TEXT = {
      en:        { title: 'Game', desc: 'Gaming content, session highlights, and recommendations.', tagPikmin: 'Pikmin Bloom', titlePikmin: "Let's Play Pikmin Bloom!", datePikmin: '2026-05-25' },
      'zh-hant': { title: '遊戲', desc: '遊戲內容、對局精選及推薦。',                               tagPikmin: 'Pikmin Bloom', titlePikmin: '一起來玩 Pikmin Bloom！',  datePikmin: '2026年5月25日' },
      'zh-hans': { title: '游戏', desc: '游戏内容、对局精选及推荐。',                               tagPikmin: 'Pikmin Bloom', titlePikmin: '一起来玩 Pikmin Bloom！',  datePikmin: '2026年5月25日' },
    };
    function applyPageText() {
      const p = PAGE_TEXT[getLang()] || PAGE_TEXT.en;
      document.getElementById('title').textContent       = p.title;
      document.getElementById('desc').textContent        = p.desc;
      document.getElementById('tag-pikmin').textContent  = p.tagPikmin;
      document.getElementById('title-pikmin').textContent = p.titlePikmin;
      document.getElementById('date-pikmin').textContent = p.datePikmin;
    }
    initPage('community');
    applyPageText();
    document.addEventListener('langchange', applyPageText);
  </script>
</body>
</html>
