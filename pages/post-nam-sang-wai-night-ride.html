    function applyPageText() {
      const p = PAGE_TEXT[getLang()] || PAGE_TEXT.en;
      document.getElementById('back-link').textContent     = p.backLink;
      document.getElementById('tag-bike').textContent      = p.tagBike;
      document.getElementById('tag-hk').textContent        = p.tagHk;
      document.getElementById('title-zh').textContent      = p.titleZh;
      document.getElementById('title-en').textContent      = p.titleEn;
      document.getElementById('meta-date').textContent     = p.metaDate;
      document.getElementById('meta-location').textContent = p.metaLocation;

      document.getElementById('caption').textContent       = p.caption;
      document.getElementById('loc-label-text').textContent = p.locLabel;
      document.getElementById('loc-value').textContent     = p.locValue;
      document.getElementById('btn-map').textContent       = p.btnMap;
    }

    function openLightbox(wrap) {
      const img = wrap.querySelector('img');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-img').alt = img.alt;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(e) {
      if (e && e.target.tagName === 'IMG' && e.target.id === 'lightbox-img') return;
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    initPage('community');
    applyPageText();
    document.addEventListener('langchange', applyPageText);
  </script>
